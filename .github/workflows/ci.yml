
name: Spatial CI

on:
  pull_request:
    branches:
      - test

jobs:
  test:
    name: Run application checks and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify application import
        run: python -c "import app"

      # test_location.py is excluded because its legacy import
      # failure is tracked separately under SP-W2-005.
      - name: Run unit tests
        run: |
          python -m pytest test_app.py test_api_security.py test_location_write.py -v -m "not integration"
